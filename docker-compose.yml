services:
  db:
    image: postgis/postgis:16-3.4
    container_name: arogyanexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: arogyanexus
      POSTGRES_USER: arogyanexus
      POSTGRES_PASSWORD: arogyanexus
    ports:
      - "5432:5432"
    volumes:
      - arogyanexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogyanexus -d arogyanexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arogyanexus_pgdata:
